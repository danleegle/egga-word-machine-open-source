name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32s3:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    env:
      IDF_COMPONENT_CHECK_NEW_VERSION: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
